<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tower of Hanoi</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-block">
        <span class="hud-label">Moves</span>
        <span class="hud-value" id="moves">0</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">Minimum</span>
        <span class="hud-value" id="min-moves">127</span>
      </div>
      <div class="hud-block stars" id="stars" aria-label="Rating: 3 stars">
        <span class="star on">&#9733;</span><span class="star on">&#9733;</span><span class="star on">&#9733;</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">Best</span>
        <span class="hud-value" id="best">&ndash;</span>
      </div>
      <button type="button" id="restart-btn" class="icon-btn" aria-label="Restart" title="Restart (R)">&#8635;</button>
    </header>

    <main id="board" aria-label="Game board">
      <div id="toast" role="status" aria-live="polite"></div>
    </main>

    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <div class="dialog">
        <div class="dlg-stars" id="dlg-stars"></div>
        <h2 id="dlg-title"></h2>
        <p id="dlg-text"></p>
        <div class="dlg-buttons">
          <button type="button" class="btn primary" id="dlg-ok"></button>
          <button type="button" class="btn" id="dlg-cancel">Cancel</button>
        </div>
      </div>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
